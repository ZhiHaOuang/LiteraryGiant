[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literary-giant"
version = "0.2.0"
description = "Chinese web-novel analysis pipeline: fetching, chapter splitting, semantic feature extraction, plot segmentation, and generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gpu = [
    "accelerate>=0.33.0",
    "pillow>=10.0.0",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "torch>=2.2.0",
    "transformers>=4.45.0,<5",
]
dev = []

[project.scripts]
fetcher-run = "fetcher.scheduling:main"
hardmodel-run = "Jormungandr.hardmodel.scheduling:main"
softmodel-run = "Jormungandr.softmodel.scheduling:main"
infermodel-run = "infermodel.scheduling:main"
generatemodel-run = "generatemodel.scheduling:main"
rename = "scripts.rename:run"
data-sync-legacy = "scripts.sync_legacy_data:main"
data-validate = "scripts.validate_data_layout:main"

[tool.setuptools.packages.find]
include = [
    "Jormungandr*",
    "fetcher*",
    "generatemodel*",
    "hardmodel*",
    "infermodel*",
    "scripts*",
    "shared*",
    "softmodel*",
]
exclude = [
    "Library*",
    "Projects*",
    "Yggdrasil*",
    "docs*",
    "models*",
    "runs*",
]
