[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literary-giant"
version = "0.2.0"
description = "Chinese web-novel analysis pipeline: fetching, chapter splitting, semantic feature extraction, plot segmentation, and generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "pypinyin>=0.53.0,<1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gpu = [
    "accelerate>=0.33.0",
    "pillow>=10.0.0",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "torch>=2.2.0",
    "transformers>=4.45.0,<5",
]
dev = []
human-export = [
    "XlsxWriter>=3.2.0,<4",
]

[project.scripts]
fetcher-run = "fetcher.scheduling:main"
hardmodel-run = "Jormungandr.hardmodel.scheduling:main"
softmodel-run = "Jormungandr.softmodel.scheduling:main"
softmodel-repair-state = "scripts.repair_softmodel_state:main"
infermodel-run = "Jormungandr.infermodel.scheduling:main"
abstractmodel-run = "Jormungandr.abstractmodel.bridge_cli:main"
abstractmodel-materialize = "Jormungandr.abstractmodel.materialize_cli:main"
abstractmodel-apply-review = "Jormungandr.abstractmodel.apply_review_cli:main"
stage-queue-plan = "scripts.stage_queue_plan:main"
rename = "scripts.rename:run"
data-sync-legacy = "scripts.sync_legacy_data:main"
data-validate = "scripts.validate_data_layout:main"
novel-organize = "scripts.organize_local_novels:main"
novel-archive-extract = "scripts.extract_novel_archives:main"
processed-corpus-migrate = "scripts.processed_corpus_migration:main"
novels-raw-migrate = "scripts.novels_raw_migration:main"
taciturn-layout-migrate = "scripts.migrate_taciturn_layout:main"
epub-to-txt = "scripts.convert_epub_novels:main"
human-library-export = "scripts.export_human_library:main"
human-library-archive = "scripts.archive_human_library:main"

[tool.setuptools.packages.find]
include = [
    "Jormungandr*",
    "fetcher*",
    "scripts*",
    "shared*",
]
exclude = [
    "Library*",
    "Projects*",
    "Yggdrasil*",
    "docs*",
    "models*",
    "runs*",
]
