reference_policy:
  primary_indexes:
    - Library/indexes/reference_index.jsonl
  allowed_reference_roots:
    - Library/TaciturnRaw
    - Library/Bridges
    - Library/AbstractLibrary
  allowed_reference_types:
    - novels_raw
    - stories_raw
    - novels_cleaned
    - stories_cleaned
    - novels_chapter
    - novels_plot
    - stories_plot
    - Worldview
    - EventsLibrary
    - CharacterArc
    - EmotionRhythm
    - Payoff_Angst
    - Memes
    - BookLogicGraph
  allow_taciturn_raw_lookup: true
  allow_bridge_lookup: true
  bridge_lookup_requires_source_ref: true
  allow_abstract_library_lookup: true
  forbid_verbatim_source_prose: true
  max_source_similarity: low
